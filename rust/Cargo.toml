[package]
name = "rust_lib_flutter_btc_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"

btc_wallet = {git = "https://github.com/hirokuma/rust-btc-keypath-wallet.git", version = "0.5.0"}
